<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1422" media="(prefers-color-scheme: dark)">
  <title>Treino Fofo</title>
  <meta name="description" content="App de treino em casa com halteres leves, hábito, dieta, remédios e peso. Pensado para incluir pessoas trans e não binárias.">
  <link rel="canonical" href="https://treinofofo.vercel.app/">

  <!-- Pré-visualização ao compartilhar o link (WhatsApp, Instagram, Telegram, redes sociais). A imagem precisa de endereço completo. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Treino Fofo">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://treinofofo.vercel.app/">
  <meta property="og:title" content="Treino Fofo">
  <meta property="og:description" content="Treino em casa com halteres leves, hábito, dieta, remédios e peso. Pensado para incluir pessoas trans e não binárias.">
  <meta property="og:image" content="https://treinofofo.vercel.app/assets/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Coelhinho treinando com halteres e o nome Treino Fofo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Treino Fofo">
  <meta name="twitter:description" content="Treino em casa com halteres leves, hábito, dieta, remédios e peso.">
  <meta name="twitter:image" content="https://treinofofo.vercel.app/assets/og.jpg">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Titan+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand-link" href="./" aria-label="Treino Fofo: ir para a tela inicial">
        <img src="assets/logo.png" alt="" width="64" height="64">
        <span class="wordmark">
          <span class="wm-treino" aria-hidden="true">Treino</span>
          <span class="wm-fofo" aria-hidden="true">Fofo</span>
        </span>
      </a>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="rest" class="rest" hidden role="timer" aria-live="off">
    <span class="rest-label">Descanso</span>
    <span id="rest-time" class="rest-time">1:15</span>
    <button id="rest-sound" class="rest-btn" type="button" aria-pressed="true" aria-label="Som do descanso ligado">🔔</button>
    <button id="rest-add" class="rest-btn" type="button">+15 s</button>
    <button id="rest-skip" class="rest-btn" type="button">Pular</button>
  </div>

  <noscript>Este app precisa de JavaScript ligado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
